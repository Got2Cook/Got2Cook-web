<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Got2Cook</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="container">
    <div class="branding">
      <div class="logo">
        <span class="logo-icon">👑</span>
        <h1 class="logo-text">Got<span class="logo-2">2</span>Cook</h1>
      </div>
      <p class="tagline">Cozinhe de acordo com seu humor</p>
      
      <!-- Perfis Salvos -->
      <div class="perfis-grid" id="perfisGrid">
        <!-- Perfis renderizados via JS -->
      </div>
    </div>

    <!-- Lado Direito - Login -->
    <div class="login-box">
      <div class="login-card">
        <h2 class="card-title">Entrar</h2>
        
        <!-- Form E-mail/Senha -->
        <form class="form-login" id="formLogin">
          <input type="email" class="input" placeholder="E-mail" required />
          <input type="password" class="input" placeholder="Senha" required />
          <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="divisor">
          <span>ou</span>
        </div>

        <!-- Botões de Login Social -->
        <button class="btn-social btn-google">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Continuar com Google</span>
        </button>

        <button class="btn-social btn-apple">
          <svg class="social-icon" viewBox="0 0 24 24">
            <path fill="#000" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          <span>Continuar com Apple</span>
        </button>

        <!-- Link Cadastro -->
        <div class="signup-link">
          Não tem conta? <a href="#" id="linkCadastro">Criar conta</a>
        </div>

        <!-- Checkbox Política de Privacidade -->
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="aceitoPolitica" class="checkbox" />
            <span>Aceito a <a href="../politica/index.html" target="_blank">Política de Privacidade</a></span>
          </label>
        </div>
      </div>

      <a href="../../index.html" class="btn-voltar">← Voltar para o site</a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
