<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Got2Cook — Login</title>
  <meta name="description" content="Entre no Got2Cook e continue sua jornada culinária." />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <header class="topo" role="banner">
    <div class="wrap header-wrap">
      <a href="/" class="logo" aria-label="Got2Cook — início">
        <span class="logo-marca">Got2Cook</span>
      </a>
    </div>
  </header>

  <main id="conteudo" class="wrap layout-auth" role="main">
    <!-- Coluna visual (desktop) -->
    <aside class="auth-aside" aria-hidden="true"></aside>

    <!-- Coluna do formulário -->
    <section class="auth-card" aria-labelledby="tituloLogin">
      <h1 id="tituloLogin" class="titulo">Entrar</h1>
      <p class="sub">Escolha um perfil ou adicione um novo.</p>

      <!-- Perfis salvos -->
      <div id="perfilContainer" class="perfis" aria-label="Perfis salvos"></div>

      <hr class="divisor" />

      <!-- Ações de login -->
      <div class="acoes" aria-label="Opções de login">
        <button class="login-btn google" type="button" aria-label="Entrar com Google">
          <span class="ico">🟢</span>
          <span class="txt">Continuar com Google</span>
        </button>

        <button class="login-btn apple" type="button" aria-label="Entrar com Apple">
          <span class="ico">⚪</span>
          <span class="txt">Continuar com Apple</span>
        </button>

        <button class="login-btn email" type="button" aria-label="Entrar com e-mail">
          <span class="ico">✉️</span>
          <span class="txt">Entrar com e-mail</span>
        </button>
      </div>

      <p class="nota-acesso" role="note">
        Dica: o botão “+” abre a galeria para criar/selecionar perfis.
      </p>
    </section>
  </main>

  <footer class="curva" role="contentinfo" aria-label="Rodapé">
    <div class="wrap curva-inner">
      <button class="btn-footer" type="button" aria-label="Voltar">
        ⬅️
      </button>
      <button class="btn-footer btn-central" id="btnLogo" type="button" aria-label="Acessar painel">
        🍳
      </button>
      <button class="btn-footer" type="button" aria-label="Minha geladeira">
        🧊
      </button>
    </div>
  </footer>

  <script src="./login.js"></script>
</body>
</html>
