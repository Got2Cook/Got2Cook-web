<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Got2Cook - Login</title>

  <!-- Igual ao seu: CSS principal desta tela -->
  <link rel="stylesheet" href="style.css" />

  <!-- Igual ao seu: PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7b7190">

  <!-- Igual ao seu: Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("Service Worker registrado!"));
    }
  </script>
</head>
<body>
  <!-- CONTAINER CENTRAL -->
  <div class="login-container" role="main" aria-labelledby="tituloLogin">
    <!-- LOGO / AVATAR SUPERIOR (igual ao padrão do app) -->
    <div class="logo-circulo" aria-hidden="true">🍳</div>

    <!-- TÍTULO -->
    <h1 id="tituloLogin" class="titulo">Entrar</h1>
    <p class="sub">Escolha um perfil salvo ou continue com uma opção de login.</p>

    <!-- PERFIS SALVOS -->
    <div id="perfilContainer" class="perfis" aria-label="Perfis salvos">
      <!-- Preenchido via login.js (mantém IDs/classes) -->
    </div>

    <!-- GALERIA (“+”) — o botão é injetado no JS com a classe .adicionar-conta -->
    <p class="dica">Dica: clique no “+” para abrir a galeria e criar/selecionar perfis.</p>

    <hr class="divisor" />

    <!-- BOTÕES DE LOGIN (mantendo classes que seu JS espera) -->
    <div class="botoes" aria-label="Opções de login">
      <button type="button" class="login-btn google" aria-label="Continuar com Google">
        <span class="ico" aria-hidden="true">🟢</span>
        <span class="txt">Continuar com Google</span>
      </button>

      <button type="button" class="login-btn apple" aria-label="Continuar com Apple">
        <span class="ico" aria-hidden="true">⚪</span>
        <span class="txt">Continuar com Apple</span>
      </button>

      <button type="button" class="login-btn email" aria-label="Entrar com e-mail">
        <span class="ico" aria-hidden="true">✉️</span>
        <span class="txt">Entrar com e-mail</span>
      </button>
    </div>

    <!-- CTA já existente no seu arquivo (mantive o id) -->
    <p class="cta-criar">Não tem conta?
      <button id="btnCriarConta" class="link-btn" type="button" aria-label="Criar conta">Criar conta</button>
    </p>
  </div>

  <!-- SCRIPTS -->
  <script src="login.js"></script>
  <script>
    // Igual ao seu: redireciona para cadastro
    const btnCriarConta = document.getElementById("btnCriarConta");
    if (btnCriarConta) {
      btnCriarConta.addEventListener("click", () => {
        window.location.href = "cadastro.html";
      });
    }
  </script>
</body>
</html>
