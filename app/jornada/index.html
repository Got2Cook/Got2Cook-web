<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Jornada - Got2Cook</title>
  <link rel="stylesheet" href="jornada.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="jornada.js" defer></script>
</head>
<body>
  <div class="container">
    <header class="topo-icones somente-titulo">
      <h1 class="titulo">MINHA JORNADA</h1>
    </header>

    <!-- Gráficos -->
    <section class="graficos">
      <div class="grafico">
        <canvas id="graficoEstilos"></canvas>
        <p class="grafico-legenda">ESTILOS PREFERIDOS</p>
      </div>
      <div class="grafico">
        <canvas id="graficoMomentos"></canvas>
        <p class="grafico-legenda">MOMENTOS DO DIA</p>
      </div>
    </section>

    <p class="contador-receitas">
      🏆 VOCÊ JÁ CRIOU <span id="contador">0</span> RECEITAS COM A GOT2COOK! 🏆
    </p>

    <h2 class="subtitulo">MINHAS CONQUISTAS:</h2>
    <section class="conquistas" id="conquistasContainer"></section>
  </div>

  <!-- Rodapé curvo -->
  <footer class="curva">
    <button class="btn-footer voltar" id="btnVoltar" type="button" aria-label="Voltar para Home">
      <img src="humor.png" alt="">
    </button>
    <button class="btn-footer logo" id="btnLogo" type="button" aria-label="Ir para Minhas Receitas">
      <img src="logocentral.png" alt="">
    </button>
    <button class="btn-footer geladeira" id="btnGeladeira" type="button" aria-label="Ir para Minha Geladeira">
      <img src="geladeira.png" alt="">
    </button>
  </footer>
</body>
</html>
