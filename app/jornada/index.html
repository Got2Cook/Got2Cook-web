<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Jornada - Got2Cook</title>

  <link rel="stylesheet" href="/app/jornada/jornada.css?v=13" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/app/jornada/jornada.js?v=13" defer></script>
</head>
<body>
  <div class="container">
    <header class="topo-icones somente-titulo">
      <h1 class="titulo">MINHA JORNADA</h1>
    </header>

    <!-- ESQUERDA: gráficos | DIREITA: conquistas -->
    <section class="layout">
      <aside class="painel-graficos" aria-label="Painel de gráficos">
        <div class="grafico">
          <h3 class="grafico-titulo">ESTILOS PREFERIDOS</h3>
          <div class="grafico-row">
            <canvas id="graficoEstilos" aria-label="Gráfico Estilos"></canvas>
            <ul class="legenda-lista" id="legendaEstilos" aria-label="Legenda Estilos"></ul>
          </div>
        </div>

        <div class="grafico">
          <h3 class="grafico-titulo">MOMENTOS DO DIA</h3>
          <div class="grafico-row">
            <canvas id="graficoMomentos" aria-label="Gráfico Momentos"></canvas>
            <ul class="legenda-lista" id="legendaMomentos" aria-label="Legenda Momentos"></ul>
          </div>
        </div>
      </aside>

      <section class="painel-conquistas" aria-label="Minhas conquistas">
        <h2 class="subtitulo">MINHAS CONQUISTAS</h2>
        <p class="contador-receitas">
          🏆 VOCÊ JÁ CRIOU <span id="contador">0</span> RECEITAS COM A GOT2COOK! 🏆
        </p>
        <section class="conquistas" id="conquistasContainer"></section>
      </section>
    </section>
  </div>

  <!-- Rodapé curvo oficial -->
  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" type="button" aria-label="Voltar para Home">
      <img src="humor.png" alt="">
    </button>
    <button class="btn-footer btn-central" id="btnLogo" type="button" aria-label="Ir para Minhas Receitas">
      <img src="logocentral.png" alt="">
    </button>
    <button class="btn-footer" id="btnGeladeira" type="button" aria-label="Ir para Minha Geladeira">
      <img src="geladeira.png" alt="">
    </button>
  </footer>
</body>
</html>
