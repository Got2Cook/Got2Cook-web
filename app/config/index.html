<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Configurações - Got2Cook</title>
  <link rel="stylesheet" href="config.css" />
</head>
<body>
  <h1>CONFIGURAÇÕES</h1>

  <div class="config-container">

    <!-- Perfil -->
    <div class="config-item">
      <label>Perfil</label>
      <button class="acao" id="editarPerfil">Editar perfil</button>
    </div>

    <!-- Seleção de Idioma -->
    <div class="config-item">
      <label for="idioma">Idioma</label>
      <select id="idioma">
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </div>

    <div class="config-item">
      <label for="lembreteHumor">Ativar lembretes de humor</label>
      <input type="checkbox" id="lembreteHumor">
    </div>

    <div class="config-item">
      <label for="receitaDia">Receita diária</label>
      <input type="checkbox" id="receitaDia">
    </div>

    <!-- Privacidade -->
    <div class="config-item">
      <a href="../politica/index.html" class="acao">Política de Privacidade</a>
    </div>

    <div class="config-item">
      <button class="acao" id="limparDados">Limpar histórico de humor</button>
    </div>

    <div class="config-item">
      <button class="acao" id="limparPreferencias">Limpar dados aprendidos</button>
    </div>

    <div class="config-item">
      <button class="acao apagar" id="apagarConta">Apagar conta</button>
    </div>

  </div>

  <!-- Pop-up genérico -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup" id="popupBox">
      <p id="popupMessage">Mensagem aqui</p>
      <div class="popup-buttons">
        <button id="popupOk">OK</button>
        <button id="popupCancel" style="display:none;">Cancelar</button>
      </div>
    </div>
  </div>

  <footer class="curva">
    <button class="btn-footer voltar" id="btnVoltar">
      <img src="humor.png" alt="Voltar" />
    </button>
    <button class="btn-footer logo" id="btnLogo">
      <img src="logocentral.png" alt="Logo" />
    </button>
    <button class="btn-footer geladeira" id="btnGeladeira">
      <img src="geladeira.png" alt="Geladeira" />
    </button>
  </footer>

   <script>
     document.getElementById("btnVoltar").addEventListener("click", () => {
       window.location.href = "humor.html";
     });

     document.getElementById("btnLogo").addEventListener("click", () => {
       window.location.href = "home.html";
     });

     document.getElementById("btnGeladeira").addEventListener("click", () => {
       window.location.href = "minhageladeira.html";
     });

     // Perfil redireciona para dados pessoais
     document.getElementById("editarPerfil").addEventListener("click", () => {
       window.location.href = "../dados-pessoais/index.html";
     });
   </script>
  
  <script src="config.js"></script>
</body>
</html>
