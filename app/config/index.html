<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Configurações - Got2Cook</title>
  <link rel="stylesheet" href="config.css"/>
  <script src="config.js" defer></script>
</head>
<body>
  <main class="wrap">
    <h1 class="titulo">CONFIGURAÇÕES</h1>

    <!-- PERFIL -->
    <section class="secao">
      <h2 class="secao-titulo">Perfil</h2>
      <ul class="lista">
        <li class="item">
          <span class="rotulo">Editar perfil</span>
          <button type="button" class="btn" id="editarPerfil">Editar</button>
        </li>
      </ul>
    </section>

    <!-- PREFERÊNCIAS BÁSICAS -->
    <section class="secao">
      <h2 class="secao-titulo">Preferências</h2>
      <ul class="lista">
        <li class="item">
          <label class="rotulo" for="idioma">Idioma</label>
          <select id="idioma">
            <option value="pt">Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </li>
        <li class="item">
          <span class="rotulo" id="lblHumor">Ativar lembretes de humor</span>
          <button type="button" class="switch" id="lembreteHumor" role="switch" aria-checked="false" aria-labelledby="lblHumor"></button>
        </li>
        <li class="item">
          <span class="rotulo" id="lblReceita">Receita diária</span>
          <button type="button" class="switch" id="receitaDia" role="switch" aria-checked="false" aria-labelledby="lblReceita"></button>
        </li>
      </ul>
    </section>

    <!-- PRIVACIDADE -->
    <section class="secao">
      <h2 class="secao-titulo">Privacidade</h2>
      <ul class="lista">
        <li class="item item-link">
          <a class="link" href="../politica/index.html">Política de Privacidade</a>
        </li>
      </ul>
    </section>

    <!-- DADOS -->
    <section class="secao">
      <h2 class="secao-titulo">Dados</h2>
      <ul class="lista">
        <li class="item">
          <span class="rotulo">Limpar histórico de humor</span>
          <button type="button" class="btn perigo" id="limparDados">Limpar</button>
        </li>
        <li class="item">
          <span class="rotulo">Limpar dados aprendidos</span>
          <button type="button" class="btn perigo" id="limparPreferencias">Limpar</button>
        </li>
        <li class="item">
          <span class="rotulo">Apagar conta</span>
          <button type="button" class="btn perigo" id="apagarConta">Apagar</button>
        </li>
      </ul>
    </section>

    <!-- SOBRE -->
    <section class="secao">
      <h2 class="secao-titulo">Sobre</h2>
      <ul class="lista">
        <li class="item">
          <span class="rotulo">Versão</span>
          <p id="versaoApp">1.0.0</p>
        </li>
      </ul>
    </section>

    <div class="footer-spacer" aria-hidden="true"></div>
  </main>

  <!-- POPUP -->
  <div class="popup-overlay" id="popupOverlay" hidden>
    <div class="popup">
      <p id="popupMessage">Mensagem</p>
      <div class="popup-buttons">
        <button id="popupOk" class="btn">OK</button>
        <button id="popupCancel" class="btn fantasma" style="display:none">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- RODAPÉ OFICIAL -->
  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" aria-label="Voltar para Home" type="button">
      <img src="../../assets/humor.png" alt="">
    </button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Ir para Minhas Receitas" type="button">
      <img src="../../assets/logocentral.png.png" alt="">
    </button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Ir para Minha Geladeira" type="button">
      <img src="../../assets/geladeira.png" alt="">
    </button>
  </footer>
</body>
</html>
