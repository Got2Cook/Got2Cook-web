<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fale Conosco - Got2Cook</title>
  <link rel="stylesheet" href="fale.css" />
</head>
<body>
  <div class="container">
    <!-- Título e subtítulo -->
    <h1 class="titulo">Fale Conosco</h1>
    <p class="descricao">Queremos ouvir você! Envie dúvidas, sugestões ou qualquer problema que encontrou no app.</p>

    <!-- Container de contato -->
    <div class="contatos">
      <div class="linha">
        <img src="../../assets/email.png" alt="E-mail" class="ico-img" />
        <span class="texto"><strong>E-mail:</strong> suporte@got2cook.com</span>
      </div>
      <div class="linha">
        <img src="../../assets/telefone.png" alt="Telefone" class="ico-img" />
        <span class="texto"><strong>Telefone:</strong> (00) 00000-0000</span>
      </div>
      <hr class="sep" aria-hidden="true" />
      <div class="linha">
        <img src="../../assets/instagram.png" alt="Instagram" class="ico-img" />
        <span class="texto"><strong>Instagram:</strong> @got2cookapp</span>
      </div>
      <div class="linha">
        <img src="../../assets/facebook.png" alt="Facebook" class="ico-img" />
        <span class="texto"><strong>Facebook:</strong> /got2cook</span>
      </div>
      <div class="linha">
        <img src="../../assets/tiktok.png" alt="TikTok" class="ico-img" />
        <span class="texto"><strong>TikTok:</strong> @got2cook</span>
      </div>

      <a href="https://wa.me/5500000000000" class="btn-whatsapp" aria-label="Falar no WhatsApp">Falar no WhatsApp</a>
      <p class="slogan">🍳 Cozinhar com humor é mais gostoso ✨</p>
    </div>

    <!-- Formulário (envelope) -->
    <form class="form-contato" novalidate>
      <input type="text" name="nome" placeholder="Seu nome (opcional)" autocomplete="name" />
      <input type="email" name="email" placeholder="Seu e-mail" required autocomplete="email" />
      <textarea name="mensagem" placeholder="Digite sua mensagem..." required></textarea>
      <a href="mailto:suporte@got2cook.com?subject=Contato%20Got2Cook" class="btn-enviar">Enviar Mensagem</a>
    </form>

    <!-- Respiro antes do rodapé -->
    <div class="footer-spacer" aria-hidden="true"></div>
  </div>

  <!-- Rodapé curvo oficial -->
  <footer class="curva" aria-label="Navegação principal">
    <button class="btn-footer" id="btnVoltar" aria-label="Voltar">
      <img src="../../assets/humor.png" alt="" />
    </button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Home">
      <img src="../../assets/logocentral.png" alt="" />
    </button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Minha Geladeira">
      <img src="../../assets/geladeira.png" alt="" />
    </button>
  </footer>

  <script src="fale.js"></script>
</body>
</html>
