<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco - Got2Cook</title>
  <link rel="stylesheet" href="faleconosco.css">
</head>
<body>

  <div class="container">

    <!-- Conteúdo principal -->
    <h1 class="titulo">Fale Conosco</h1>
    <p class="descricao">
      Queremos ouvir você! Envie dúvidas, sugestões ou qualquer problema que encontrou no app.
    </p>

    <!-- Informações de contato -->
    <div class="contatos">
      <p><strong>📧 E-mail:</strong> suporte@got2cook.com</p>
      <p><strong>📞 Telefone:</strong> (00) 00000-0000</p>
    </div>

    <!-- Formulário de contato (vira uma "carta") -->
    <form class="form-contato">
      <input type="text" name="nome" placeholder="Seu nome (opcional)">
      <input type="email" name="email" placeholder="Seu e-mail" required>
      <textarea name="mensagem" placeholder="Digite sua mensagem..." required></textarea>

      <!-- Botão que abre o app de e-mail -->
      <a href="mailto:suporte@got2cook.com?subject=Contato%20Got2Cook" class="btn-enviar">
        Enviar Mensagem
      </a>
    </form>

    <!-- Rodapé padrão -->
    <footer class="curva">
      <button class="btn-footer voltar" id="btnVoltar">
        <img src="humor.png" alt="Voltar" />
      </button>
      <button class="btn-footer logo" id="btnLogo">
        <img src="logocentral.png" alt="Logo" />
      </button>
      <button class="btn-footer geladeira" id="btnGeladeira">
        <img src="geladeira.png" alt="Geladeira" />
      </button>
    </footer>

     <!-- Navegação original (mantida) -->
     <script>
       document.getElementById("btnVoltar").addEventListener("click", () => {
         window.location.href = "humor.html";
       });

       document.getElementById("btnLogo").addEventListener("click", () => {
         window.location.href = "home.html";
       });

       document.getElementById("btnGeladeira").addEventListener("click", () => {
         window.location.href = "minhageladeira.html";
       });
     </script>

     <!-- Script da animação da carta -->
     <script src="faleconosco.js"></script>

  </div>

</body>
</html>
