<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco - Got2Cook</title>
  <link rel="stylesheet" href="fale.css">
</head>
<body>

  <div class="container">

    <!-- Título e subtítulo -->
    <h1 class="titulo">Fale Conosco</h1>
    <p class="descricao">
      Queremos ouvir você! Envie dúvidas, sugestões ou qualquer problema que encontrou no app.
    </p>

    <!-- Container moderno de contato -->
    <div class="contatos">
      <p><strong>📧 E-mail:</strong> suporte@got2cook.com</p>
      <p><strong>📞 Telefone:</strong> (00) 00000-0000</p>

      <!-- Redes sociais -->
      <div class="redes">
        <a href="#"><img src="instagram.png" alt="Instagram"></a>
        <a href="#"><img src="facebook.png" alt="Facebook"></a>
        <a href="#"><img src="tiktok.png" alt="TikTok"></a>
      </div>

      <!-- Botão WhatsApp -->
      <a href="https://wa.me/5500000000000" class="btn-whatsapp">Falar no WhatsApp</a>

      <!-- Slogan -->
      <p class="slogan">🍳 Cozinhar com humor é mais gostoso ✨</p>
    </div>

    <!-- Formulário (envelope animado) -->
    <form class="form-contato">
      <input type="text" name="nome" placeholder="Seu nome (opcional)">
      <input type="email" name="email" placeholder="Seu e-mail" required>
      <textarea name="mensagem" placeholder="Digite sua mensagem..." required></textarea>
      <a href="mailto:suporte@got2cook.com?subject=Contato%20Got2Cook" class="btn-enviar">
        Enviar Mensagem
      </a>
    </form>

    <!-- Rodapé -->
    <footer class="curva">
      <button class="btn-footer voltar" id="btnVoltar">
        <img src="humor.png" alt="Voltar" />
      </button>
      <button class="btn-footer logo" id="btnLogo">
        <img src="logocentral.png" alt="Logo" />
      </button>
      <button class="btn-footer geladeira" id="btnGeladeira">
        <img src="geladeira.png" alt="Geladeira" />
      </button>
    </footer>

    <script src="fale.js"></script>
  </div>

</body>
</html>
