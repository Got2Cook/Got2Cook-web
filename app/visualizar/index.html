<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizar Receita - Got2Cook</title>
  <!-- bump pra limpar cache -->
  <link rel="stylesheet" href="visualizar.css?v=42" />
</head>
<body>
  <main id="conteudo">
    <div class="grid-web">
      <!-- Coluna da imagem -->
      <figure class="cover-wrap">
        <img id="coverReceita" src="../../assets/receita_exemplo.png" alt="Imagem da receita" />
      </figure>

      <!-- Coluna do texto -->
      <div class="lado-texto">
        <h1 id="tituloReceita" tabindex="-1">RECEITA GERADA</h1>

        <div class="meta" role="group" aria-label="Informações da receita">
          <span id="metaTempo" class="chip">⏱️ —</span>
          <span id="metaDificuldade" class="chip">Dificuldade —</span>
          <span id="metaPorcoes" class="chip">Humor —</span>
        </div>

        <section class="bloco" aria-labelledby="tituloReceitaBloco">
          <h3 id="tituloReceitaBloco" class="sec-title">Receita</h3>

          <div id="textoReceita" class="texto-receita" data-scroll="off">
            <h4 class="sub-title"><span class="emoji start" aria-hidden="true">🥣</span>Ingredientes:</h4>
            <ol id="listaIngredientes" class="lista"></ol>

            <h4 class="sub-title"><span class="emoji start" aria-hidden="true">🍳</span>Modo de preparo:</h4>
            <ol id="listaPassos" class="lista"></ol>
          </div>

          <button id="btnLerMais" class="btn-lermais" type="button" aria-controls="textoReceita" aria-expanded="false">
            Ler mais
          </button>
        </section>

        <div class="acoes">
          <button id="btnSalvar" class="btn-coracao" type="button" aria-pressed="false" aria-label="Salvar receita">
            <span class="coracao" aria-hidden="true">♡</span>
          </button>

          <button id="btnGerarNovamente" class="btn-gerar" type="button" aria-label="Gerar novamente">
            Gerar novamente
          </button>

          <div id="liveMsg" class="sr-only" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="curva">
    <button class="btn-footer voltar" id="btnVoltar">
      <img src="../../assets/humor.png" alt="Humor" />
    </button>
    <button class="btn-footer logo" id="btnLogo">
      <img src="../../assets/logocentral.png" alt="Logo" />
    </button>
    <button class="btn-footer geladeira" id="btnGeladeira">
      <img src="../../assets/geladeira.png" alt="Geladeira" />
    </button>
  </footer>

  <script src="visualizar.js?v=24" defer></script>
</body>
</html>
