<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizar Receita - Got2Cook</title>
  <link rel="stylesheet" href="visualizar.css?v=18" />
</head>
<body>
  <main id="conteudo">
    <div class="grid-web">
      <!-- Coluna da imagem -->
      <figure class="cover-wrap">
        <img id="coverReceita" src="../../assets/receita_exemplo.png" alt="Imagem da receita" />
      </figure>

      <!-- Coluna do texto (mesma altura da imagem no desktop) -->
      <div class="lado-texto">
        <h2 id="tituloReceita" tabindex="-1">RECEITA GERADA</h2>

        <div class="meta" role="group" aria-label="Informações da receita">
          <span id="metaTempo" class="chip">⏱️ —</span>
          <span id="metaDificuldade" class="chip">Dificuldade —</span>
          <span id="metaPorcoes" class="chip">Humor —</span>
        </div>

        <!-- BLOCO ÚNICO: Ingredientes + Modo de Preparo -->
        <section class="bloco" aria-labelledby="tituloReceitaBloco">
          <h3 id="tituloReceitaBloco" class="sec-title">Receita</h3>

          <!-- Container rolável (a página não rola; só este bloco) -->
          <div id="textoReceita" class="texto-receita" data-scroll="off">
            <!-- Ingredientes em LISTA (mesmo estilo dos passos) -->
            <h4 class="sub-title">
              <img class="ico" src="../../assets/lapis.png" alt="" aria-hidden="true" />
              Ingredientes
            </h4>
            <ol id="listaIngredientes" class="lista"></ol>

            <h4 class="sub-title">Modo de Preparo</h4>
            <ol id="listaPassos" class="lista"></ol>
          </div>

          <button id="btnLerMais"
                  class="btn-lermais"
                  type="button"
                  aria-controls="textoReceita"
                  aria-expanded="false">
            Ler mais
          </button>
        </section>

        <div class="acoes">
          <button id="btnSalvar" class="btn-coracao" type="button"
                  aria-pressed="false" aria-label="Salvar receita">
            <span class="coracao" aria-hidden="true">♡</span>
          </button>

          <button id="btnGerarNovamente" class="btn-gerar" type="button">
            Gerar novamente
          </button>

          <div id="liveMsg" class="sr-only" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Rodapé curvo padrão -->
  <nav class="curva" aria-label="Navegação principal">
    <button class="btn-footer" id="btnVoltar" aria-label="Humor">
      <img src="../../assets/humor.png" alt="Humor" />
    </button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Gerar Receita">
      <img src="../../assets/logocentral.png" alt="Gerar Receita" />
    </button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Minha Geladeira">
      <img src="../../assets/geladeira.png" alt="Minha Geladeira" />
    </button>
  </nav>

  <script src="visualizar.js?v=18" defer></script>
</body>
</html>
