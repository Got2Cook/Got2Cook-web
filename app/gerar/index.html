<!-- /app/gerar/index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerar Receita - Got2Cook</title>
  <link rel="stylesheet" href="gerar.css" />
  <link rel="icon" href="../../assets/logo.png" />
</head>
<body>
  <main>
    <header class="topo">
      <h1>GERAR RECEITA</h1>
    </header>

    <!-- Filtros -->
    <div class="filtros">
      <button class="btn-filtro" data-tipo="doce">
        <span class="emoji">🍰</span>
        DOCE
      </button>
      <button class="btn-filtro" data-tipo="salgado">
        <span class="emoji">🍕</span>
        SALGADO
      </button>
    </div>

    <!-- Busca -->
    <div class="busca-wrapper">
      <div class="busca">
        <img src="../../assets/lupa.png" class="icone-lupa" alt="">
        <input 
          type="text" 
          id="inputBusca"
          placeholder="Ex: arroz, frango, batata..." 
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Lista de Compras + Botão Gerar -->
    <div class="area-lista-compras">
      <div class="card-lista">
        <div class="header-lista">
          <h2>
            <span class="emoji">🛒</span>
            Minha Lista de Compras
          </h2>
          <span class="contador" id="contadorItens">0 itens</span>
        </div>
        
        <div class="lista-itens" id="listaItens">
          <div class="placeholder-vazio" id="placeholderVazio">
            <span class="emoji-grande">📝</span>
            <p>Clique nos ingredientes abaixo para adicionar à sua lista</p>
          </div>
        </div>
      </div>

      <button class="btn-gerar" id="btnGerar" disabled>
        <span class="icone-gerar">→</span>
        <span class="texto">Gerar Receita</span>
      </button>
    </div>

    <!-- Minha Geladeira -->
    <section class="geladeira">
      <h2 class="titulo-secao">
        <span class="emoji">🧊</span>
        MINHA GELADEIRA
      </h2>
      <div class="geladeira-grid" id="geladeiraGrid"></div>
    </section>
  </main>

  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" aria-label="Voltar">
      <img src="../../assets/humor.png" alt="" />
    </button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Ir para Home">
      <img src="../../assets/logocentral.png" alt="" />
    </button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Ir para Geladeira">
      <img src="../../assets/geladeira.png" alt="" />
    </button>
  </footer>

  <script src="gerar.js"></script>
</body>
</html>
