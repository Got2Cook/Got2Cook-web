<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histórico de Receitas - Got2Cook</title>
  <link rel="stylesheet" href="historico.css" />
</head>
<body>
  <main id="conteudo">
    <h1 class="titulo-principal" id="tituloPagina">HISTÓRICO DE RECEITAS</h1>

    <!-- Barra de controle -->
    <section class="controles" aria-label="Controles de histórico">
      <div class="busca-wrap">
        <label for="inpBusca" class="sr-only">Buscar receita</label>
        <input id="inpBusca" class="inp-busca" type="search" placeholder="Buscar por nome..." autocomplete="off" />
        <button id="btnLimparBusca" class="btn-sec" type="button" aria-label="Limpar busca">✕</button>
      </div>

      <fieldset class="grupo-filtros">
        <legend class="sr-only">Filtros de período</legend>
        <div class="filtros-periodo" role="radiogroup" aria-label="Período">
          <button type="button" class="chip" data-periodo="hoje">Hoje</button>
          <button type="button" class="chip" data-periodo="7">7 dias</button>
          <button type="button" class="chip" data-periodo="30">30 dias</button>
          <button type="button" class="chip" data-periodo="90">90 dias</button>
          <button type="button" class="chip" data-periodo="todos" aria-pressed="true">Todos</button>
        </div>
      </fieldset>

      <div class="linha-ordenacao">
        <label for="selOrdenacao" class="sr-only">Ordenar</label>
        <select id="selOrdenacao">
          <option value="recente">Recente → Antigo</option>
          <option value="az">Nome A→Z</option>
        </select>

        <button id="btnLimparFiltros" class="btn-sec" type="button">Limpar filtros</button>
      </div>
    </section>

    <!-- Lista de histórico -->
    <section aria-live="polite" aria-busy="false">
      <ul id="listaHistorico" class="lista-historico" aria-label="Lista de receitas por data">
        <!-- itens renderizados via JS -->
      </ul>

      <!-- Estado vazio -->
      <div id="estadoVazio" class="estado-vazio" hidden>
        <p>Seu histórico está vazio.</p>
        <a class="link-acao" href="../minhas-receitas/index.html">Ver Minhas Receitas</a>
      </div>

      <!-- Skeleton simples (opcional) -->
      <div id="skeleton" class="skeleton" hidden></div>

      <!-- Paginação -->
      <div class="paginacao">
        <button id="btnCarregarMais" class="btn-prim" type="button">Carregar mais</button>
      </div>
    </section>
  </main>

  <!-- Rodapé oficial -->
  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" type="button" aria-label="Voltar para Home">
      <img src="humor.png" alt="" />
    </button>

    <button class="btn-footer btn-central" id="btnLogo" type="button" aria-label="Ir para Minhas Receitas">
      <img src="logocentral.png" alt="" />
    </button>

    <button class="btn-footer" id="btnGeladeira" type="button" aria-label="Ir para Minha Geladeira">
      <img src="geladeira.png" alt="" />
    </button>
  </footer>

  <script src="historico.js" defer></script>
</body>
</html>
