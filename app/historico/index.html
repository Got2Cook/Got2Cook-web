<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histórico de Receitas - Got2Cook</title>
  <link rel="stylesheet" href="historico.css?v=13" />
</head>
<body>
  <main id="conteudo">
    <h1 class="titulo-principal">HISTÓRICO DE RECEITAS</h1>

    <section class="layout-historico" aria-label="Histórico">
      <!-- ESQUERDA: Calendário (sticky no desktop) -->
      <aside class="lado-calendario">
        <!-- Wrapper com perspectiva + stage para “folhinha” -->
        <section class="calendario-container flip-perspective" aria-label="Selecionar dia do histórico">
          <div class="calendario-page" id="calPage">
            <div class="mes-navegacao">
              <button id="mesAnterior" type="button" aria-label="Mês anterior">◀</button>
              <span id="mesAno" aria-live="polite"></span>
              <button id="mesProximo" type="button" aria-label="Próximo mês">▶</button>
            </div>
            <div class="dias-semana" aria-hidden="true">
              <span>Dom</span><span>Seg</span><span>Ter</span>
              <span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
            </div>
            <div id="dias" class="dias"></div>

            <div class="linha-calendario-acoes">
              <button id="btnLimparDia" class="btn-sec sm" type="button" aria-label="Mostrar todos os dias">Mostrar todos</button>
            </div>
          </div>

          <!-- Palco das folhas arrancando (clones) -->
          <div id="tearStage" class="tear-stage" aria-hidden="true"></div>
        </section>
      </aside>

      <!-- DIREITA: Busca + Período + Lista -->
      <section class="lado-conteudo">
        <section class="controles card" aria-label="Controles de histórico">
          <div class="pesquisa-container">
            <label for="inpBusca" class="sr-only">Buscar receita</label>
            <input id="inpBusca" class="pesquisar-input" type="search" placeholder="Buscar por nome..." autocomplete="off" />
            <button id="btnLimparBusca" class="btn-sec" type="button" aria-label="Limpar busca">✕</button>
          </div>

          <fieldset class="grupo-filtros">
            <legend class="sr-only">Período</legend>
            <div class="filtros-periodo" role="radiogroup" aria-label="Período">
              <button type="button" class="chip" data-periodo="hoje" aria-pressed="false">Hoje</button>
              <button type="button" class="chip" data-periodo="7" aria-pressed="false">Últimos 7 dias</button>
              <button type="button" class="chip" data-periodo="30" aria-pressed="false">Últimos 30 dias</button>
              <button type="button" class="chip" data-periodo="90" aria-pressed="false">Últimos 90 dias</button>
              <button type="button" class="chip" data-periodo="todos" aria-pressed="true">Todos</button>
            </div>
          </fieldset>
        </section>

        <section aria-live="polite" aria-busy="false">
          <ul id="listaHistorico" class="lista-historico list-card" aria-label="Lista de receitas por data"></ul>

          <div id="estadoVazio" class="estado-vazio" hidden>
            <p>Seu histórico está vazio.</p>
            <a class="link-acao" href="../minhas-receitas/index.html">Ver Minhas Receitas</a>
          </div>

          <div id="skeleton" class="skeleton" hidden></div>

          <div class="paginacao">
            <button id="btnCarregarMais" class="btn-prim" type="button">Carregar mais</button>
          </div>
        </section>
      </section>
    </section>
  </main>

  <!-- Rodapé oficial -->
  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" type="button" aria-label="Voltar para Home">
      <img src="humor.png" alt="" />
    </button>

    <button class="btn-footer btn-central" id="btnLogo" type="button" aria-label="Ir para Minhas Receitas">
      <img src="logocentral.png" alt="" />
    </button>

    <button class="btn-footer" id="btnGeladeira" type="button" aria-label="Ir para Minha Geladeira">
      <img src="geladeira.png" alt="" />
    </button>
  </footer>

  <script src="historico.js?v=13" defer></script>
</body>
</html>
