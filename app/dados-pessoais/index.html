<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dados Pessoais - Got2Cook</title>
  <link rel="stylesheet" href="dados-pessoais.css" />
</head>
<body>
  <main id="conteudo" class="container">
    <h1 class="titulo">Dados Pessoais</h1>

    <!-- GRID: foto à esquerda, dados à direita (empilha no mobile) -->
    <section class="perfil-grid">
      <!-- COLUNA FOTO -->
      <div class="perfil-topo">
        <div class="foto-perfil">
          <img id="fotoPerfil" src="../assets/perfil.png" alt="Foto de perfil" />
          <span id="emojiHumor">😀</span>
        </div>

        <input type="file" id="inputFoto" accept="image/*" style="display:none" />
        <button class="alterar-foto" id="btnAlterarFoto" aria-label="Alterar foto">Alterar Foto</button>
      </div>

      <!-- COLUNA DADOS (MESMO VISUAL DO QUE VOCÊ MANDOU) -->
      <div class="bloco-dados">
        <div class="linha">
          <span class="emoji">👤</span>
          <span><strong>Nome:</strong>
            <span id="campoNome" class="editavel" tabindex="0">Usuário</span>
            <button id="btnEditarNome" class="btn-lapis" aria-label="Editar nome">✏️</button>
          </span>
        </div>

        <div class="linha">
          <span class="emoji">✉️</span>
          <span><strong>E-mail:</strong>
            <span id="campoEmail" class="editavel" tabindex="0">email@exemplo.com</span>
            <button id="btnEditarEmail" class="btn-lapis" aria-label="Editar e-mail">✏️</button>
          </span>
        </div>

        <div class="linha">
          <span class="emoji">🍽️</span>
          <span><strong>Preferência alimentar:</strong></span>
          <div class="tags" id="preferencias">
            <!-- mesmas tags base do seu arquivo -->
            <label><input type="checkbox" class="tag-checkbox" value="VEGETARIANO" /> VEGETARIANO</label>
            <label><input type="checkbox" class="tag-checkbox" value="VEGANO" /> VEGANO</label>
            <label><input type="checkbox" class="tag-checkbox" value="CELÍACO" /> CELÍACO</label>
            <label><input type="checkbox" class="tag-checkbox" value="DIABÉTICO" /> DIABÉTICO</label>
            <label><input type="checkbox" class="tag-checkbox" value="HIPOLACTASIA" /> HIPOLACTASIA</label>
          </div>

          <div class="preferencias-acoes">
            <input id="preferenciaNova" type="text" placeholder="Adicionar preferência..." aria-label="Nova preferência" />
            <button id="btnAddPreferencia" class="btn" aria-label="Adicionar preferência">+</button>
          </div>

          <ul id="preferenciasLista" class="chips" aria-live="polite"></ul>
        </div>

        <div class="linha">
          <span class="emoji">👩‍🍳</span>
          <span><strong>Nível culinário:</strong></span>
          <div class="nivel-botoes" id="nivel">
            <button class="nivel-btn" data-nivel="basico">BÁSICO</button>
            <button class="nivel-btn" data-nivel="intermediario">INTERMEDIÁRIO</button>
            <button class="nivel-btn" data-nivel="avancado">AVANÇADO</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- RODAPÉ PADRÃO -->
  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" aria-label="Ir para Humor">
      <img src="../assets/humor.png" alt="" />
    </button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Ir para Home">
      <img src="../assets/logocentral.png" alt="" />
    </button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Ir para Minha Geladeira">
      <img src="../assets/geladeira.png" alt="" />
    </button>
  </footer>

  <script src="dados-pessoais.js"></script>
</body>
</html>
