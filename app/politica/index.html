<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Política de Privacidade - Got2Cook</title>
  <link rel="stylesheet" href="politica.css" />
</head>
<body>
  <main id="conteudo">
    <div class="grid-web">
      <!-- Cabeçalho (opcional: manter alinhado ao padrão das demais telas) -->
      <header class="topo-icones" aria-label="Navegação superior">
        <!-- Se sua tela Configurações tiver ícones aqui, mantenha as mesmas classes/IDs -->
      </header>

      <!-- Título principal -->
      <h1 id="titulo-pagina" class="titulo-pagina" tabindex="-1">POLÍTICA DE PRIVACIDADE</h1>

      <!-- Conteúdo da política -->
      <article id="politica-conteudo" class="conteudo-politica" aria-labelledby="titulo-pagina">
        <!-- COLE AQUI O TEXTO EXATO DA POLÍTICA, SEM ALTERAR NADA.
             Estruture apenas com <section> <h2> e <p> (ou listas) mantendo o MESMO TEXTO. Ex.:
          <section>
            <h2>Introdução</h2>
            <p>...texto EXATO...</p>
          </section>
        -->
      </article>

      <!-- Respiro acima do rodapé -->
      <div class="footer-spacer" aria-hidden="true"></div>
    </div>
  </main>

  <!-- Rodapé curvo oficial -->
  <footer class="curva" role="navigation" aria-label="Navegação principal">
    <button id="btnVoltar" class="btn-footer" aria-label="Voltar"></button>
    <button id="btnLogo" class="btn-footer btn-central" aria-label="Início"></button>
    <button id="btnGeladeira" class="btn-footer" aria-label="Minha Geladeira"></button>
  </footer>

  <script src="politica.js"></script>
</body>
</html>
