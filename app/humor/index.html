<!-- /app/humor/index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Como você está se sentindo?</title>
  <link rel="stylesheet" href="humor.css" />
</head>
<body>
  <div class="container">
    <div class="balao pergunta fade-in">
      Como você está se sentindo hoje?
    </div>

    <div class="emojis fade-in-up">
      <button onclick="selecionarHumor('😀')" aria-label="Feliz">😀</button>
      <button onclick="selecionarHumor('😐')" aria-label="Neutro">😐</button>
      <button onclick="selecionarHumor('😢')" aria-label="Triste">😢</button>
      <button onclick="selecionarHumor('😡')" aria-label="Irritado">😡</button>
      <button onclick="selecionarHumor('😴')" aria-label="Cansado">😴</button>
      <button onclick="selecionarHumor('🤢')" aria-label="Enjoado">🤢</button>
      <button onclick="selecionarHumor('😍')" aria-label="Apaixonado">😍</button>
      <button onclick="selecionarHumor('🤯')" aria-label="Surpreso">🤯</button>
    </div>

    <div id="humorSelecionado" class="balao resposta" style="display:none;"></div>

    <div class="curva">
      <button class="pular" onclick="pularHumor()">Pular</button>
    </div>
  </div>

  <script src="humor.js"></script>
</body>
</html>
