<!-- /app/cadastro/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar Conta - Got2Cook</title>
  <link rel="stylesheet" href="cadastro.css" />
</head>
<body>
  <div class="container">
    <h1 class="page-title">Crie sua conta</h1>

    <div class="form-box">
      <form class="form-cadastro" id="formCadastro" novalidate>
        <div class="input-wrapper">
          <input type="text" class="input" id="nome" required />
          <label for="nome" class="input-label">Nome completo</label>
          <span class="input-erro" id="erroNome"></span>
        </div>

        <div class="input-wrapper">
          <input type="email" class="input" id="email" required />
          <label for="email" class="input-label">E-mail</label>
          <span class="input-erro" id="erroEmail"></span>
        </div>
        
        <div class="input-wrapper">
          <input type="password" class="input" id="senha" required />
          <label for="senha" class="input-label">Senha</label>
          <div class="senha-requisitos" id="senhaRequisitos">
            <p class="requisito" data-req="length">
              <span class="check">✓</span> Mínimo 8 caracteres
            </p>
            <p class="requisito" data-req="upper">
              <span class="check">✓</span> Uma letra maiúscula
            </p>
            <p class="requisito" data-req="lower">
              <span class="check">✓</span> Uma letra minúscula
            </p>
            <p class="requisito" data-req="number">
              <span class="check">✓</span> Um número
            </p>
          </div>
          <span class="input-erro" id="erroSenha"></span>
        </div>

        <div class="input-wrapper">
          <input type="password" class="input" id="confirmarSenha" required />
          <label for="confirmarSenha" class="input-label">Confirmar senha</label>
          <span class="input-erro" id="erroConfirmarSenha"></span>
        </div>

        <div class="input-wrapper">
          <input type="date" class="input" id="nascimento" required />
          <label for="nascimento" class="input-label">Data de nascimento</label>
          <span class="input-erro" id="erroNascimento"></span>
        </div>

        <div class="input-wrapper">
          <input type="text" class="input" id="cep" maxlength="9" required />
          <label for="cep" class="input-label">CEP</label>
          <span class="input-erro" id="erroCep"></span>
        </div>

        <div class="input-wrapper">
          <input type="text" class="input" id="cidade" readonly />
          <label for="cidade" class="input-label">Cidade</label>
        </div>

        <div class="input-wrapper">
          <input type="text" class="input" id="estado" readonly />
          <label for="estado" class="input-label">Estado</label>
        </div>

        <div class="emoji-section">
          <label class="emoji-label">Escolha seu emoji:</label>
          <div class="emoji-grid">
            <button type="button" class="emoji-btn selecionado" data-emoji="😊">😊</button>
            <button type="button" class="emoji-btn" data-emoji="🥰">🥰</button>
            <button type="button" class="emoji-btn" data-emoji="😋">😋</button>
            <button type="button" class="emoji-btn" data-emoji="😎">😎</button>
            <button type="button" class="emoji-btn" data-emoji="🤗">🤗</button>
            <button type="button" class="emoji-btn" data-emoji="😇">😇</button>
          </div>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="aceitoPolitica" class="checkbox" required />
            <span>Li e aceito a <a href="../politica/index.html" target="_blank">Política de Privacidade</a></span>
          </label>
          <span class="input-erro" id="erroPolitica"></span>
        </div>

        <button type="submit" class="btn-submit">Criar Conta</button>
      </form>

      <button class="btn-voltar" id="voltarLogin">← Voltar ao Login</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="cadastro.js"></script>
</body>
</html>
