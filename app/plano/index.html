<!-- /app/plano/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerenciar Plano — Got2Cook</title>
  <link rel="stylesheet" href="./meuplano.css" />
</head>
<body>
  <main class="wrap" id="topo">
    <h1 class="titulo">GERENCIAR PLANO</h1>

    <!-- Meu Plano Atual -->
    <section class="meu-plano" aria-live="polite">
      <div class="meu-plano__icone" id="meuPlanoIcone" aria-hidden="true">🥗</div>
      <div class="meu-plano__texto">
        <p class="meu-plano__nome">
          Plano atual: <strong id="meuPlanoNome">Gratuito</strong>
        </p>
        <p class="meu-plano__status" id="meuPlanoStatus">Válido até —</p>
      </div>
      <div class="meu-plano__acoes">
        <button type="button" class="btn secundario" id="btnAlterar">Alterar plano</button>
        <button type="button" class="btn fantasma" id="btnCancelar">Cancelar assinatura</button>
      </div>
    </section>

    <!-- Seleção de Plano (Radio Group) -->
    <section class="selecionar" aria-labelledby="tituloSelecao">
      <h2 id="tituloSelecao" class="sr-only">Selecione seu plano</h2>

      <!-- Mobile: cartões empilhados -->
      <div class="cards-mobile" role="radiogroup" aria-labelledby="tituloSelecao">
        <!-- Card Gratuito -->
        <label class="card plano--free" tabindex="0">
          <input type="radio" name="plano" value="Gratuito" class="radio-plano" aria-label="Selecionar plano Gratuito" />
          <div class="card__topo">
            <span class="plano__icone" aria-hidden="true">🥗</span>
            <div class="plano__titulos">
              <span class="plano__nome">Gratuito</span>
              <span class="plano__preco">R$ 0/mês</span>
            </div>
          </div>
          <ul class="beneficios">
            <li><span class="ok" aria-hidden="true">✓</span> 3 receitas/dia</li>
            <li><span class="no" aria-hidden="true">✕</span> Favoritar receitas</li>
            <li><span class="no" aria-hidden="true">✕</span> Relatórios detalhados</li>
            <li><span class="no" aria-hidden="true">✕</span> Histórico de humor completo</li>
            <li><span class="no" aria-hidden="true">✕</span> Suporte prioritário</li>
          </ul>
        </label>

        <!-- Card Premium -->
        <label class="card plano--premium" tabindex="0">
          <span class="selo-popular" aria-hidden="true">⭐ Mais Popular</span>
          <input type="radio" name="plano" value="Premium" class="radio-plano" aria-label="Selecionar plano Premium" />
          <div class="card__topo">
            <span class="plano__icone" aria-hidden="true">👑</span>
            <div class="plano__titulos">
              <span class="plano__nome">Premium</span>
              <span class="plano__preco">R$ 9,90/mês</span>
            </div>
          </div>
          <ul class="beneficios">
            <li><span class="ok" aria-hidden="true">✓</span> Receitas ilimitadas</li>
            <li><span class="ok" aria-hidden="true">✓</span> Favoritar receitas</li>
            <li><span class="ok" aria-hidden="true">✓</span> Relatórios detalhados</li>
            <li><span class="ok" aria-hidden="true">✓</span> Histórico de humor completo</li>
            <li><span class="ok" aria-hidden="true">✓</span> Suporte prioritário</li>
          </ul>
        </label>
      </div>

      <!-- Desktop: comparação em colunas -->
      <div class="tabela-desktop" role="radiogroup" aria-labelledby="tituloSelecao">
        <div class="tabela__cabecalho">
          <div class="tabela__col tabela__col--rotulo" aria-hidden="true"></div>
          <label class="tabela__col tabela__col--free" tabindex="0">
            <input type="radio" name="planoDesktop" value="Gratuito" class="radio-plano" aria-label="Selecionar plano Gratuito" />
            <div class="tabela__head">
              <span class="plano__nome">Gratuito</span>
              <span class="plano__preco">R$ 0/mês</span>
            </div>
          </label>
          <label class="tabela__col tabela__col--premium" tabindex="0">
            <span class="selo-popular" aria-hidden="true">⭐ Mais Popular</span>
            <input type="radio" name="planoDesktop" value="Premium" class="radio-plano" aria-label="Selecionar plano Premium" />
            <div class="tabela__head premium-head">
              <span class="plano__nome">Premium</span>
              <span class="plano__preco">R$ 9,90/mês</span>
            </div>
          </label>
        </div>

        <div class="tabela__linha">
          <div class="tabela__rotulo">Receitas por dia</div>
          <div class="tabela__cel">3</div>
          <div class="tabela__cel tabela__cel--premium">Ilimitadas</div>
        </div>
        <div class="tabela__linha">
          <div class="tabela__rotulo">Favoritar receitas</div>
          <div class="tabela__cel"><span class="no">✕</span></div>
          <div class="tabela__cel tabela__cel--premium"><span class="ok">✓</span></div>
        </div>
        <div class="tabela__linha">
          <div class="tabela__rotulo">Relatórios detalhados</div>
          <div class="tabela__cel"><span class="no">✕</span></div>
          <div class="tabela__cel tabela__cel--premium"><span class="ok">✓</span></div>
        </div>
        <div class="tabela__linha">
          <div class="tabela__rotulo">Histórico de humor</div>
          <div class="tabela__cel"><span class="no">✕</span></div>
          <div class="tabela__cel tabela__cel--premium"><span class="ok">✓</span></div>
        </div>
        <div class="tabela__linha">
          <div class="tabela__rotulo">Suporte prioritário</div>
          <div class="tabela__cel"><span class="no">✕</span></div>
          <div class="tabela__cel tabela__cel--premium"><span class="ok">✓</span></div>
        </div>
      </div>
    </section>

    <!-- Ações extras -->
    <section class="extras">
      <button type="button" class="btn secundario" id="btnHistorico">Histórico de Pagamentos</button>
    </section>

    <!-- Espaço para não cobrir o conteúdo pelo CTA fixo e rodapé -->
    <div class="footer-spacer"></div>
  </main>

  <!-- CTA fixo -->
  <div class="cta-fixo" role="region" aria-label="Ação principal">
    <button type="button" class="btn primario" id="btnConfirmar" aria-live="polite">Continuar</button>
  </div>

  <!-- Rodapé curvo oficial -->
  <footer class="curva" aria-label="Navegação principal">
    <button class="btn-footer" id="btnVoltar" aria-label="Voltar para Configurações">⟵</button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Ir para Minhas Receitas">🍳</button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Ir para Minha Geladeira">🧊</button>
  </footer>

  <script src="./meuplano.js"></script>
</body>
</html>
