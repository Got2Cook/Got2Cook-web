<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Plano - Got2Cook</title>
  <link rel="stylesheet" href="plano.css">
</head>
<body>

  <div class="container">

    <h1 class="titulo">Meu Plano</h1>

    <!-- Card do plano atual -->
    <div class="plano-atual" id="planoAtualCard">
      <div class="icone-plano" id="iconePlano"></div>
      <h2>Meu Plano Atual</h2>
      <p class="nome-plano" id="planoAtual"></p>
      <p class="renovacao" id="dataRenovacao"></p>
    </div>

    <!-- Tabela comparativa -->
    <h2 class="subtitulo">Compare os planos</h2>
    <div class="tabela-comparativa">
      <table>
        <thead>
          <tr>
            <th>Benefício</th>
            <th>🥗 Gratuito</th>
            <th>👑 Premium</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Receitas por dia</td><td>3</td><td>✅ Ilimitadas</td></tr>
          <tr><td>Salvar receitas favoritas</td><td>❌</td><td>✅</td></tr>
          <tr><td>Relatórios detalhados</td><td>❌</td><td>✅</td></tr>
          <tr><td>Histórico de humor completo</td><td>❌</td><td>✅</td></tr>
          <tr><td>Suporte prioritário</td><td>❌</td><td>✅</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Cards de planos -->
    <div class="planos">

      <!-- Card Gratuito -->
      <div class="card-plano" data-plano="Gratuito">
        <h3>🥗 Gratuito</h3>
        <div class="valor-plano">R$ 0<span>/mês</span></div>
        <!-- Botão removido -->
      </div>

      <!-- Card Premium -->
      <div class="card-plano destaque" data-plano="Premium">
        <div class="selo-popular">⭐ Mais Popular</div>
        <h3>👑 Premium</h3>
        <div class="valor-plano destaque-valor">R$ 9,90<span>/mês</span></div>
        <button class="btn-plano" onclick="fazerLoginPremium()">Fazer Login Premium</button>
      </div>

    </div>

    <!-- Rodapé padrão -->
    <footer class="curva">
      <button class="btn-footer voltar" id="btnVoltar">
        <img src="humor.png" alt="Voltar" />
      </button>
      <button class="btn-footer logo" id="btnLogo">
        <img src="logocentral.png" alt="Logo" />
      </button>
      <button class="btn-footer geladeira" id="btnGeladeira">
        <img src="geladeira.png" alt="Geladeira" />
      </button>
    </footer>

  </div>

  <script src="plano.js"></script>
</body>
</html>
