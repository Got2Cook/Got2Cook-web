<html lang="pt-br">
<head>

  <title>Minha Geladeira — Got2Cook</title>
  <link rel="stylesheet" href="geladeira.css"/>
</head>
<body>
  <div class="page">
    <main class="conteudo" tabindex="-1">
      <h1>MINHA GELADEIRA</h1>
      <div class="search-bar">
        <input type="text" id="search" placeholder="Buscar..." aria-label="Buscar ingrediente"/>
      </div>

      <div class="fridge-wrap" id="fridgeWrap">
        <img src="/assets/geladeira-fechada.png" alt="Fechar" class="fridge-closed" id="fridgeClosed"/>
        <div class="fridge-open" id="fridgeOpen" hidden>
          <div class="items-grid" id="itemsGrid"></div>
          <button class="add-btn" id="addBtn">+ Adicionar</button>
        </div>
      </div>

      <div class="backdrop" id="backdrop" hidden></div>
      <dialog class="modal" id="modal" hidden>
        <div class="modal-header">
          <h2>Ingredientes</h2>
          <button class="close-btn" id="closeBtn">×</button>
        </div>
        <div class="tabs" id="tabs"></div>
        <input type="text" id="modalSearch" placeholder="Filtrar..." class="modal-search"/>
        <div class="selected-chips" id="selectedChips" hidden>
          <div class="chips-top">
            <span id="selectedCount">0</span>
            <button id="clearBtn" class="clear-link">Limpar</button>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="gallery" id="gallery"></div>
        <div class="modal-footer">
          <button class="btn-secondary" id="customBtn">Manual</button>
          <button class="btn-primary" id="confirmBtn">Adicionar</button>
        </div>
      </dialog>

      <footer class="curva">
        <button class="btn-footer" id="btnBack" aria-label="Voltar">
          <img src="/assets/humor.png" alt=""/>
        </button>
        <button class="btn-footer logo" id="btnHome" aria-label="Home">
          <img src="/assets/logocentral.png" alt=""/>
        </button>
        <button class="btn-footer" id="btnFridge" aria-label="Geladeira">
          <img src="/assets/geladeira.png" alt=""/>
        </button>
      </footer>
    </main>
  </div>
