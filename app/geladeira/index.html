<!-- /app/geladeira/index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minha Geladeira — Got2Cook</title>
  <meta name="description" content="Gerencie os ingredientes da sua geladeira no Got2Cook. Adicione itens, marque como acabou e organize o que você tem em casa." />
  <link rel="stylesheet" href="./geladeira.css" />
</head>
<body>
  <div class="page">
    <main id="conteudo" class="conteudo" tabindex="-1">
      
      <header class="header-geladeira">
        <h1 class="titulo-geladeira">MINHA GELADEIRA</h1>
        <p class="subtitulo-geladeira">Organize seus ingredientes e facilite sua vida na cozinha</p>
      </header>

      <section class="pesquisa-container" aria-label="Buscar ingredientes na geladeira">
        <div class="barra-pesquisa">
          <img src="/assets/lupa.png" alt="" class="lupa" aria-hidden="true">
          <input type="text" id="campoBusca" placeholder="Buscar ingrediente na geladeira..." aria-label="Buscar ingrediente" />
        </div>
      </section>

      <!-- Geladeira adaptável -->
      <div class="geladeira-container" id="geladeiraWrap">
        
        <!-- Container/Moldura que envolve as portas -->
        <div class="geladeira-frame">
          
          <!-- MOBILE: Uma porta -->
          <div class="porta-wrapper porta-wrapper--mobile">
            <div class="porta-simples">
              <img src="/assets/geladeira-fechada.png" alt="Geladeira" class="porta-img" />
            </div>
          </div>

          <!-- DESKTOP: Duas portas -->
          <div class="porta-wrapper porta-wrapper--desktop">
            <div class="porta-esquerda">
              <img src="/assets/geladeira-esquerda.png" alt="Porta esquerda" class="porta-img" />
            </div>
            <div class="porta-direita">
              <img src="/assets/geladeira-direita.png" alt="Porta direita" class="porta-img" />
            </div>
          </div>

          <!-- Hint centralizado -->
          <div class="porta-hint">
            <span class="hint-icon">👆</span>
            <span class="hint-text">Clique para abrir</span>
          </div>
        </div>

        <!-- Interior (mesmo para mobile e desktop) -->
        <div class="geladeira-aberta" id="geladeiraAberta" aria-hidden="true">
          <div class="geladeira-header">
            <span class="geladeira-luz" aria-hidden="true"></span>
            <h2 class="geladeira-titulo">Seus Ingredientes</h2>
            <span class="geladeira-count" id="ingredientesCount">0 itens</span>
          </div>

          <div class="conteudo-geladeira" id="conteudoGeladeira"></div>

          <div class="geladeira-footer">
            <button class="btn-adicionar" id="abrirIngrediente">
              <span class="btn-adicionar-icon">+</span>
              <span class="btn-adicionar-texto">Adicionar Ingredientes</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div id="modalBackdrop" class="modal-backdrop" hidden></div>
      <dialog id="modalGaleria" class="popup" aria-labelledby="modalTitulo" hidden>
        
        <div class="popup__header">
          <div class="popup__header-content">
            <h2 id="modalTitulo">
              <span class="modal-icon">🛒</span>
              Escolha seus ingredientes
            </h2>
            <p class="modal-subtitle">Selecione da nossa lista ou adicione manualmente</p>
          </div>
          <button class="fechar" id="fecharModal" aria-label="Fechar">
            <span aria-hidden="true">×</span>
          </button>
        </div>

        <div class="popup__filters">
          <div class="filters-tabs">
            <label class="filters-label">Categorias:</label>
            <div class="tabs" id="tabsCategorias" role="tablist" aria-label="Categorias de ingredientes"></div>
          </div>
          <div class="barra-pesquisa barra-pesquisa--modal">
            <img src="/assets/lupa.png" alt="" class="lupa" aria-hidden="true">
            <input type="text" id="buscaModal" placeholder="Digite para filtrar..." aria-label="Filtrar ingrediente por nome" />
          </div>
        </div>

        <section class="selecionados-compacto" id="selecionadosWrap" aria-live="polite" hidden>
          <div class="selecionados__resumo">
            <strong id="selecionadosCount">
              <span class="count-badge">0</span>
              <span>selecionados</span>
            </strong>
            <button class="btn-link-small" id="verSelecionados" aria-label="Ver ingredientes selecionados">
              Ver selecionados
            </button>
          </div>
        </section>

        <div class="galeria-wrapper">
          <div class="galeria" id="galeriaIngredientes" aria-label="Galeria de ingredientes disponíveis">
            <div class="skeleton-item" aria-hidden="true"></div>
            <div class="skeleton-item" aria-hidden="true"></div>
            <div class="skeleton-item" aria-hidden="true"></div>
            <div class="skeleton-item" aria-hidden="true"></div>
            <div class="skeleton-item" aria-hidden="true"></div>
            <div class="skeleton-item" aria-hidden="true"></div>
          </div>
        </div>

        <div class="popup__footer">
          <button class="btn-modal btn-modal--secondary" id="adicionarManual">
            <span aria-hidden="true">✏️</span>
            Outro ingrediente?
          </button>
          <button class="btn-modal btn-modal--primary" id="adicionarSelecao">
            <span aria-hidden="true">✓</span>
            Adicionar à geladeira
          </button>
        </div>
      </dialog>

      <div class="toast" id="toast" aria-live="assertive" aria-atomic="true" hidden>
        <span class="toast-icon" id="toastIcon">✓</span>
        <span class="toast-message" id="toastMessage"></span>
      </div>

      <div id="modalSelecionadosBackdrop" class="modal-backdrop" hidden></div>
      <dialog id="modalSelecionados" class="popup-selecionados" hidden>
        <div class="popup__header">
          <h2>Ingredientes Selecionados</h2>
          <button class="fechar" id="fecharSelecionados" aria-label="Fechar">×</button>
        </div>
        <div class="chips-list" id="chipsListModal"></div>
        <div class="popup__footer">
          <button class="btn-modal btn-modal--secondary" id="limparTodosSelecionados">
            🗑️ Limpar tudo
          </button>
          <button class="btn-modal btn-modal--primary" id="fecharModalSelecionados">
            Voltar
          </button>
        </div>
      </dialog>

      <div class="sr-only" aria-live="polite" id="ariaAnnouncer"></div>

    </main>

    <footer class="curva">
      <button class="btn-footer voltar" id="btnVoltar" aria-label="Selecionar humor novamente">
        <img src="/assets/humor.png" alt="" />
      </button>
      <button class="btn-footer logo" id="btnLogo" aria-label="Abrir atalhos rápidos">
        <img src="/assets/logocentral.png" alt="" />
      </button>
      <button class="btn-footer geladeira" id="btnGeladeira" aria-label="Abrir Minha Geladeira">
        <img src="/assets/geladeira.png" alt="" />
      </button>
    </footer>
  </div>

  <script src="./geladeira.js"></script>
</body>
</html>
