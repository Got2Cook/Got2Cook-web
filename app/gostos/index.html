<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Gostos - Got2Cook</title>
  <link rel="stylesheet" href="gostos.css" />
</head>
<body>
  <div class="container">
    <h1 class="titulo">MEUS GOSTOS</h1>

    <!-- Preferidos -->
<div class="lista preferidos">
  <h3>✔️</h3>
  <ul id="listaPreferidos" class="lista-itens" aria-label="Alimentos preferidos"></ul>
  <button class="btn-mais" type="button" id="btnAddPreferido"
          aria-haspopup="dialog" aria-controls="janelaSelecao"
          aria-label="Adicionar preferido">＋</button>
</div>

<!-- Restrições -->
<div class="lista restricoes">
  <h3>❌</h3>
  <ul id="listaRestricoes" class="lista-itens" aria-label="Alimentos restritos"></ul>
  <button class="btn-mais" type="button" id="btnAddRestrito"
          aria-haspopup="dialog" aria-controls="janelaSelecao"
          aria-label="Adicionar restrição">＋</button>
</div>

    <!-- Janela de seleção -->
    <div id="janelaSelecao" class="janela" role="dialog" aria-modal="true" aria-labelledby="tituloSelecao" style="display:none">
      <div class="conteudo-janela">
        <h3 id="tituloSelecao">Selecione:</h3>
        <ul id="opcoesIngrediente"></ul>
        <button class="fechar" id="btnFechar">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Rodapé curvo oficial -->
  <footer class="curva">
    <button class="btn-footer voltar" id="btnVoltar" aria-label="Voltar para Home">
      <img src="humor.png" alt="" />
    </button>
    <button class="btn-footer logo" id="btnLogo" aria-label="Ir para Minhas Receitas">
      <img src="logocentral.png" alt="" />
    </button>
    <button class="btn-footer geladeira" id="btnGeladeira" aria-label="Ir para Minha Geladeira">
      <img src="geladeira.png" alt="" />
    </button>
  </footer>

  <script src="gostos.js" defer></script>
</body>
</html>
