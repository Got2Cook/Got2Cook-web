<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Gostos - Got2Cook</title>
  <link rel="stylesheet" href="gostos.css" />
</head>
<body>
  <div class="container">
    <h1 class="titulo">MEUS GOSTOS</h1>

    <div class="listas-gostos">
      <!-- Preferidos -->
      <div class="lista preferidos">
        <h3>✔️</h3>
        <ul id="listaPreferidos" class="lista-itens"></ul>
        <button class="btn-mais" type="button" onclick="abrirSelecao('preferido')">＋</button>
      </div>

      <!-- Restrições -->
      <div class="lista restricoes">
        <h3 style="color:red;">❌</h3>
        <ul id="listaRestricoes" class="lista-itens"></ul>
        <button class="btn-mais" type="button" onclick="abrirSelecao('restrito')">＋</button>
      </div>
    </div>

    <!-- Janela de seleção -->
    <div id="janelaSelecao" class="janela" style="display:none">
      <div class="conteudo-janela">
        <h3>Selecione:</h3>

        <div id="opcoesContainer" class="opcoes-container">
          <input id="buscaOpcao" type="search" placeholder="Buscar item..." oninput="filtrarOpcoes()"/>

          <div id="opcoesGrid" class="opcoes-grid"><!-- opções via JS --></div>

          <!-- Barra de adicionar (permanece) -->
          <div id="personalizarWrap" class="personalizar">
            <input id="personalizadoInput" type="text" maxlength="30" placeholder="DIGITE UM ALIMENTO..."/>
            <button class="btn-ok" type="button" onclick="confirmarPersonalizado()">Adicionar</button>
          </div>

          <!-- Apenas FECHAR abaixo da barra -->
          <div class="linha-acoes bottom-actions">
            <button class="fechar" type="button" onclick="fecharSelecao()">Fechar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

    <footer class="curva" aria-label="Navegação principal">
    <nav class="curva__nav">
      <a id="btnVoltar" class="btn-footer" href="../humor/index.html" aria-label="Voltar para Humor">
        <img src="../../assets/humor.png" alt="" />
      </a>

      <a id="btnLogo" class="btn-footer btn-central" href="../home/index.html" aria-label="Gerar receita (logo)">
        <img src="../../assets/logocentral.png" alt="" />
      </a>

      <a id="btnGeladeira" class="btn-footer" href="../geladeira/index.html" aria-label="Ir para Minha Geladeira">
        <img src="../../assets/geladeira.png" alt="" />
      </a>
    </nav>
  </footer>

  <script src="gostos.js" defer></script>
</body>
</html>
