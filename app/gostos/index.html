<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Gostos - Got2Cook</title>
  <link rel="stylesheet" href="gostos.css" />
</head>
<body>
  <div class="container">
    <h1 class="titulo">MEUS GOSTOS</h1>

    <div class="listas-gostos">
      <!-- Lista Preferidos -->
      <div class="lista preferidos">
        <h3>✔️</h3>
        <ul id="listaPreferidos" class="lista-itens"></ul>
        <button class="btn-mais" onclick="abrirSelecao('preferido')">＋</button>
      </div>

      <!-- Lista Restrições -->
      <div class="lista restricoes">
        <h3 style="color: red;">❌</h3>
        <ul id="listaRestricoes" class="lista-itens"></ul>
        <button class="btn-mais" onclick="abrirSelecao('restrito')">＋</button>
      </div>
    </div>

    <!-- Janela de seleção -->
    <div id="janelaSelecao" class="janela">
      <div class="conteudo-janela">
        <h3>Selecione:</h3>
        <ul id="opcoesIngrediente"></ul>
        <button class="fechar" onclick="fecharSelecao()">Fechar</button>
      </div>
    </div>
  </div>

  <footer class="curva">
    <button class="btn-footer voltar" id="btnVoltar">
      <img src="humor.png" alt="Voltar" />
    </button>
    <button class="btn-footer logo" id="btnLogo">
      <img src="logocentral.png" alt="Logo" />
    </button>
    <button class="btn-footer geladeira" id="btnGeladeira">
      <img src="geladeira.png" alt="Geladeira" />
    </button>
  </footer>

  <script src="global.js"></script>

  <script>
    const ingredientesPreferidos = ["LACTOSE", "GLÚTEN", "FRUTOS DO MAR", "OVO", "CASTANHAS", "AMENDOIM", "SOJA", "MILHO", "CORANTES", "CAFEÍNA", "CARNE VERMELHA", "FRANGO"];
    const ingredientesRestritos = ["LACTOSE", "GLÚTEN", "FRUTOS DO MAR", "OVO", "CASTANHAS", "AMENDOIM", "SOJA", "MILHO", "CORANTES", "CAFEÍNA", "CARNE VERMELHA", "FRANGO", ];
    let listaAtual = "preferido";

    function abrirSelecao(tipo) {
      listaAtual = tipo;
      const lista = document.getElementById("opcoesIngrediente");
      lista.innerHTML = "";
      const dados = tipo === "preferido" ? ingredientesPreferidos : ingredientesRestritos;
      dados.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        li.onclick = () => adicionarIngrediente(tipo, item);
        lista.appendChild(li);
      });
      document.getElementById("janelaSelecao").style.display = "flex";
    }

    function fecharSelecao() {
      document.getElementById("janelaSelecao").style.display = "none";
    }

    function adicionarIngrediente(tipo, valor) {
      const listaId = tipo === "preferido" ? "listaPreferidos" : "listaRestricoes";
      const lista = document.getElementById(listaId);
      if (![...lista.children].some(li => li.textContent.includes(valor))) {
        const li = document.createElement("li");
        li.innerHTML = `${valor} <button class="excluir" onclick="removerIngrediente(this)">✖</button>`;
        lista.appendChild(li);
        salvarLocalStorage();
      }
      fecharSelecao();
    }

    function removerIngrediente(botao) {
      botao.parentElement.remove();
      salvarLocalStorage();
    }

    function salvarLocalStorage() {
      const preferidos = [...document.getElementById("listaPreferidos").children].map(li => li.textContent.replace("✖", "").trim());
      const restritos = [...document.getElementById("listaRestricoes").children].map(li => li.textContent.replace("✖", "").trim());
      localStorage.setItem("gostosPreferidos", JSON.stringify(preferidos));
      localStorage.setItem("gostosRestritos", JSON.stringify(restritos));
    }

    function carregarLocalStorage() {
      const preferidos = JSON.parse(localStorage.getItem("gostosPreferidos")) || [];
      const restritos = JSON.parse(localStorage.getItem("gostosRestritos")) || [];
      preferidos.forEach(item => adicionarIngrediente("preferido", item));
      restritos.forEach(item => adicionarIngrediente("restrito", item));
    }

    document.getElementById("btnVoltar").onclick = () => window.location.href = "humor.html";
    document.getElementById("btnLogo").onclick = () => window.location.href = "home.html";
    document.getElementById("btnGeladeira").onclick = () => window.location.href = "minhageladeira.html";
    window.onload = carregarLocalStorage;
  </script>
</body>
</html>
