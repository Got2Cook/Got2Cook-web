<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Gostos - Got2Cook</title>
  <link rel="stylesheet" href="gostos.css" />
</head>
<body>
  <div class="container">
    <h1 class="titulo">MEUS GOSTOS</h1>

    <div class="listas-gostos">
      <!-- Preferidos -->
      <div class="lista preferidos">
        <h3>✔️</h3>
        <ul id="listaPreferidos" class="lista-itens"></ul>
        <button class="btn-mais" type="button" onclick="abrirSelecao('preferido')">＋</button>
      </div>

      <!-- Restrições -->
      <div class="lista restricoes">
        <h3 style="color:red;">❌</h3>
        <ul id="listaRestricoes" class="lista-itens"></ul>
        <button class="btn-mais" type="button" onclick="abrirSelecao('restrito')">＋</button>
      </div>
    </div>

    <!-- Janela de seleção (container organizado + personalização) -->
    <div id="janelaSelecao" class="janela" style="display:none">
      <div class="conteudo-janela">
        <h3>Selecione:</h3>

        <div class="opcoes-container">
          <input id="buscaOpcao" type="search" placeholder="Buscar item..." oninput="filtrarOpcoes()"/>

          <div id="opcoesGrid" class="opcoes-grid"><!-- opções renderizadas via JS --></div>

          <div class="linha-personalizar">
            <button class="btn-personalizar" type="button" onclick="abrirPersonalizar()">Personalizar</button>
            <button class="btn-ia" type="button" onclick="irParaPrompt()">Personalizar com IA</button>
          </div>

          <div id="personalizarWrap" class="personalizar" style="display:none">
            <input id="personalizadoInput" type="text" maxlength="30" placeholder="Digite um alimento..."/>
            <button class="btn-ok" type="button" onclick="confirmarPersonalizado()">Adicionar</button>
          </div>
        </div>

        <button class="fechar" type="button" onclick="fecharSelecao()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Rodapé curvo oficial -->
  <footer class="curva">
    <button class="btn-footer" id="btnVoltar" aria-label="Voltar para Home">
      <img src="humor.png" alt="">
    </button>
    <button class="btn-footer btn-central" id="btnLogo" aria-label="Ir para Minhas Receitas">
      <img src="logocentral.png" alt="">
    </button>
    <button class="btn-footer" id="btnGeladeira" aria-label="Ir para Minha Geladeira">
      <img src="geladeira.png" alt="">
    </button>
  </footer>

  <script src="global.js"></script>

  <script>
    // ===== Dados-base (mantive seu padrão) =====
    const ingredientesPreferidos = ["LACTOSE","GLÚTEN","FRUTOS DO MAR","OVO","CASTANHAS","AMENDOIM","SOJA","MILHO","CORANTES","CAFEÍNA","CARNE VERMELHA","FRANGO"];
    const ingredientesRestritos  = ["LACTOSE","GLÚTEN","FRUTOS DO MAR","OVO","CASTANHAS","AMENDOIM","SOJA","MILHO","CORANTES","CAFEÍNA","CARNE VERMELHA","FRANGO"];

    // ===== Estado da seleção modal =====
    let listaAtual = "preferido";           // 'preferido' | 'restrito'
    let opcoesOriginais = [];               // array base para filtro
    let opcoesFiltradas = [];               // array atual exibido

    // ===== Abertura/fechamento modal =====
    function abrirSelecao(tipo) {
      listaAtual = tipo;
      document.getElementById("janelaSelecao").style.display = "flex";

      opcoesOriginais = (tipo === "preferido" ? ingredientesPreferidos : ingredientesRestritos).slice();
      opcoesOriginais.sort((a,b) => a.localeCompare(b, 'pt-BR'));
      opcoesFiltradas = opcoesOriginais.slice();

      document.getElementById('buscaOpcao').value = "";
      renderOpcoes();
    }
    function fecharSelecao() {
      document.getElementById("janelaSelecao").style.display = "none";
      document.getElementById('personalizarWrap').style.display = "none";
    }

    // ===== Render das opções (container organizado) =====
    function renderOpcoes(){
      const grid = document.getElementById('opcoesGrid');
      grid.innerHTML = "";
      opcoesFiltradas.forEach(item => {
        const b = document.createElement('button');
        b.type = "button";
        b.className = "opcao-btn";
        b.textContent = item;
        b.onclick = () => adicionarIngrediente(listaAtual, item);
        grid.appendChild(b);
      });
    }

    // ===== Busca/filtro =====
    function filtrarOpcoes(){
      const q = (document.getElementById('buscaOpcao').value || "").trim().toUpperCase();
      opcoesFiltradas = !q ? opcoesOriginais.slice()
                           : opcoesOriginais.filter(x => x.toUpperCase().includes(q));
      renderOpcoes();
    }

    // ===== Personalizar (item digitado) =====
    function abrirPersonalizar(){
      const box = document.getElementById('personalizarWrap');
      box.style.display = (box.style.display === "none" || box.style.display === "") ? "grid" : "none";
      if(box.style.display === "grid"){
        document.getElementById('personalizadoInput').focus();
      }
    }
    function confirmarPersonalizado(){
      const inp = document.getElementById('personalizadoInput');
      const valor = (inp.value || "").trim();
      if(!valor) return;
      adicionarIngrediente(listaAtual, valor.toUpperCase());
      inp.value = "";
      document.getElementById('personalizarWrap').style.display = "none";
      fecharSelecao();
    }

    // ===== Ir direto ao prompt de receita (tela Gerar) =====
    function irParaPrompt(){
      // dica: se quiser focar o campo lá, salve um flag:
      // localStorage.setItem('got2cook_focus_prompt','1');
      window.location.href = "../gerar/index.html";
    }

    // ===== Adição/remoção + persistência =====
    function adicionarIngrediente(tipo, valor) {
      const listaId = (tipo === "preferido") ? "listaPreferidos" : "listaRestricoes";
      const ul = document.getElementById(listaId);
      if (![...ul.children].some(li => li.textContent.replace("✖","").trim() === valor)) {
        const li = document.createElement("li");
        li.innerHTML = `${valor} <button class="excluir" type="button" onclick="removerIngrediente(this)">✖</button>`;
        ul.appendChild(li);
        salvarLocalStorage();
      }
    }
    function removerIngrediente(botao) {
      botao.parentElement.remove();
      salvarLocalStorage();
    }
    function salvarLocalStorage() {
      const pref = [...document.getElementById("listaPreferidos").children].map(li => li.textContent.replace("✖","").trim());
      const rest = [...document.getElementById("listaRestricoes").children].map(li => li.textContent.replace("✖","").trim());
      localStorage.setItem("gostosPreferidos", JSON.stringify(pref));
      localStorage.setItem("gostosRestritos", JSON.stringify(rest));
    }
    function carregarLocalStorage() {
      const pref = JSON.parse(localStorage.getItem("gostosPreferidos") || "[]");
      const rest = JSON.parse(localStorage.getItem("gostosRestritos")  || "[]");
      pref.forEach(v => adicionarIngrediente("preferido", v));
      rest.forEach(v => adicionarIngrediente("restrito", v));
    }

    // ===== Navegação rodapé =====
    document.getElementById("btnVoltar").onclick   = () => window.location.href = "../humor/index.html";
    document.getElementById("btnLogo").onclick     = () => window.location.href = "../home/index.html";
    document.getElementById("btnGeladeira").onclick= () => window.location.href = "../geladeira/index.html";

    // boot
    window.onload = carregarLocalStorage;
  </script>
</body>
</html>
