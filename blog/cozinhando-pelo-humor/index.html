<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Título do Post — Got2Cook</title>
  <meta name="description" content="Resumo do post para SEO." />
  <link rel="stylesheet" href="../post.css" />
</head>
<body>
  <div class="read-progress" id="progress"></div>

  <!-- Header igual ao do blog -->
  <header class="blog-header">
    <div class="container">
      <a class="brand" href="/">Got2Cook</a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="/">Início</a>
        <a href="/app/">App</a>
        <a class="active" href="/blog/">Blog</a>
        <a href="/#contato">Contato</a>
      </nav>
    </div>
  </header>

  <!-- Capa do post (estilo do hero do blog) -->
  <section class="post-hero">
    <div class="bg" style="background-image:url('/assets/blog/capas/humor.png')"></div>
    <div class="overlay"></div>
    <div class="inner">
      <h1 class="post-title">Cozinhando pelo humor: como nossas emoções podem guiar o prato do dia</h1>
      <div class="post-meta">
        <span class="meta-chip">01 out 2025</span>
        <span class="meta-chip">6 min</span>
        <span class="meta-chip">Humor</span>
        <span class="meta-chip">Dicas</span>
        <span class="meta-chip">Ciência</span>
      </div>
    </div>
  </section>

  <!-- Corpo -->
  <div class="post-wrap">
    <article>
      <p>Introdução…</p>

      <figure class="figure">
        <img src="/assets/blog/inline/humor-matriz.png" alt="Emoções e pratos correspondentes">
        <figcaption>Emoções e sugestões de pratos.</figcaption>
      </figure>

      <h2>Subtítulo</h2>
      <p>Texto…</p>

      <blockquote>Destaque do artigo em estilo got2cook.</blockquote>

      <hr />

      <h2>Outro tópico</h2>
      <p>Texto…</p>
    </article>

    <nav class="post-nav" aria-label="Navegação entre artigos">
      <a href="/blog/">← Voltar ao Blog</a>
      <!-- <a href="/blog/proximo-post/">Próximo →</a> -->
    </nav>
  </div>

  <script>
    // Barra de progresso de leitura
    const bar = document.getElementById('progress');
    const onScroll = () => {
      const h = document.documentElement;
      const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight);
      bar.style.width = (scrolled * 100).toFixed(2) + '%';
    };
    document.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  </script>
</body>
</html>
