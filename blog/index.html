<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Got2Cook</title>
  <meta name="description" content="Receitas, dicas e bastidores — descubra novas formas de cozinhar e economizar tempo na cozinha!">
  <link rel="stylesheet" href="./blog.css" />
</head>
<body>
  <!-- HEADER ROXO COM MARCA CENTRAL -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" aria-label="Got2Cook">Got2Cook</a>
    </div>
  </header>

  <!-- HERO COM IMAGEM DE FUNDO, OVERLAY VERDE, TÍTULO, SUB E FILTROS PÍLULA + CARD LATERAL -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content container">
      <div class="hero-left">
        <h1>Blog Got2Cook</h1>
        <p>Receitas, dicas e bastidores — descubra novas formas de cozinhar e economizar tempo na cozinha!</p>

        <div class="filters">
          <label for="busca" class="sr-only">Buscar artigos</label>
          <input id="busca" type="search" placeholder="Buscar artigos..." autocomplete="off" />

          <label for="categoria" class="sr-only">Todas as categorias</label>
          <div class="select-wrap">
            <select id="categoria">
              <option value="">Todas as categorias</option>
            </select>
            <span class="chev">▾</span>
          </div>
        </div>
      </div>

      <aside class="hero-card">
        <h3>Cozinhe com seu humor!</h3>
        <p>Veja como o app combina seu humor com ingredientes da geladeira</p>
        <a class="btn-cta" href="/app/">Conhecer</a>
      </aside>
    </div>
  </section>

  <!-- LISTA + SLOT DE ANÚNCIO EM 3 COLUNAS -->
  <main class="container main-grid">
    <section id="lista-posts" class="cards"></section>

    <aside class="ad-slot">
      <div class="ad-box">
        <span>(espaço para anuncio)</span>
      </div>
    </aside>
  </main>

  <script src="./blog.js" defer></script>
</body>
</html>
